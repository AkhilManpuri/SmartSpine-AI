<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartSpine AI Healthcare - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
  </style>
</head>
<body class="theme-dark">

  <div class="auth-container" style="width: 100%;">
    <div class="auth-card glass-panel" style="margin: auto; max-width: 460px;">
      <div class="text-center mb-6">
        <span style="font-size: 2rem;">🦴</span>
        <h2 class="mt-2">Create Account</h2>
      </div>
      <p class="mb-6 text-center text-secondary">Start tracking your posture health</p>

      {% if errors %}
        <div class="alert alert-danger">
          <ul class="mb-0">
            {% for error in errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <form action="/register" method="POST">
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your full name">
        </div>
        <div class="form-group mt-4">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="form-group mt-4">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" required placeholder="Minimum 8 chars, upper + number">
        </div>
        <div class="form-group mt-4">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Confirm password">
        </div>
        <button type="submit" class="btn btn-primary w-full mt-6">Create Account</button>
      </form>

      <p class="mt-4 text-center text-sm">
        Already have an account?
        <a href="/login" class="text-secondary">Log in</a>
      </p>
      <p class="mt-4 text-center text-sm"><a href="/" class="text-secondary">&larr; Back to Home</a></p>
    </div>
  </div>

</body>
</html>
